name: Cohérence du site public
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  liens-et-documents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Liens, ancres, ressources et footer sur toutes les pages
        run: python outils/verifier-coherence.py . --strict --output "$RUNNER_TEMP/coherence.json"
      - name: Header commun sans divergence
        run: python outils/header/generer.py . --check
      - name: Chaque formulaire public possède un honeypot ou un usage local déclaré
        run: python outils/verifier-honeypots.py --inventaire
      - name: Syntaxe des scripts des parcours modifiés
        run: |
          for script in assets/js/header.js accueil.js script.js consent.js assets/js/analytics.js assets/js/documents-legaux.js assets/js/contact.js assets/js/aides.js assets/js/salons.js assets/js/proposer-salon.js assets/js/antispam.js assets/js/mesure-guide-logiciel.js; do
            node --check "$script"
          done

      - name: Composants des futurs articles
        run: node --test outils/test-harmoniser-article.cjs

      - name: Cohérence de la vitrine et du catalogue de démonstration
        run: |
          python outils/votre-futur-vignoble/generer.py --check
          node --check votre-futur-vignoble/filtres.js
          node --check votre-futur-vignoble/majorite.js
          node --check votre-futur-vignoble/boutique.js
          node --check votre-futur-vignoble/cartes.js

      - name: Veille des salons sans réseau
        run: python -m unittest discover -s outils/salons/veille -p 'test_*.py'

      - name: Concours et jeux viticoles
        run: |
          node --check concours/concours.js
          node --check concours/millesime/taille-moteur.js
          node --check concours/millesime/taille-scene.js
          node --check concours/millesime/atelier-taille.js
          node --check concours/millesime/parcours-moteur.js
          node --check concours/millesime/parcours-jeu.js
          node --check concours/millesime/guidage.js
          node --test outils/test-concours-taille.cjs
          node --test outils/test-concours-parcours.cjs
          node --check demonstration/site.js
          node outils/verifier-demonstration.cjs .
          node --check visite-interactive/site.js
          node --check visite-interactive/saisons.js
          node --check visite-interactive/fonctions.js
          node outils/verifier-demonstration.cjs . visite-interactive
