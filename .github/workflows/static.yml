# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Générer le header commun
        run: python outils/header/generer.py .
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # Minification et CSS de l'accueil intégré à la page (outils/construire/
      # construire.js), sur cette copie seulement. En cas d'échec, le site part
      # tel quel : l'étape ne bloque pas le déploiement.
      - name: Optimiser le site
        continue-on-error: true
        run: |
          DEPS="$RUNNER_TEMP/construire"
          mkdir -p "$DEPS"
          cp outils/construire/package.json outils/construire/package-lock.json "$DEPS/"
          npm ci --prefix "$DEPS" --ignore-scripts --no-audit --no-fund --loglevel=error
          NODE_PATH="$DEPS/node_modules" node outils/construire/construire.js .
      - name: Retirer l'outillage de la copie publiée
        run: rm -rf outils
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Attendre la disponibilité de l’artefact Pages
        uses: actions/github-script@v7
        with:
          script: |
            for (let attempt = 0; attempt < 18; attempt++) {
              const {data} = await github.rest.actions.listWorkflowRunArtifacts({
                ...context.repo, run_id: context.runId
              });
              if (data.artifacts.some(artifact => artifact.name === 'github-pages' && !artifact.expired)) {
                core.info('Artefact Pages disponible pour cette exécution.');
                return;
              }
              core.info('Artefact Pages en attente d’indexation ; nouvelle vérification dans 5 secondes.');
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            core.setFailed('L’artefact github-pages reste introuvable après 90 secondes ; déploiement non lancé.');
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
