name: Cohérence du site public
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  liens-et-documents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Liens, ancres, ressources et footer sur toutes les pages
        run: python outils/verifier-coherence.py . --strict --output "$RUNNER_TEMP/coherence.json"
      - name: Syntaxe des scripts des parcours modifiés
        run: |
          for script in accueil.js script.js consent.js assets/js/analytics.js assets/js/documents-legaux.js assets/js/contact.js assets/js/aides.js; do
            node --check "$script"
          done

      - name: Composants des futurs articles
        run: node --test outils/test-harmoniser-article.cjs

      - name: Démonstration viticole, liens et absence de transmission
        run: |
          node --check demonstration/site.js
          node outils/verifier-demonstration.cjs .
          node --check demonstration-2/site.js
          node --check demonstration-2/saisons.js
          node --check demonstration-2/fonctions.js
          node outils/verifier-demonstration.cjs . demonstration-2
          node --check demonstration-2-1/site.js
          node --check demonstration-2-1/guide.js
          node --check demonstration-2-1/fonctions.js
          node --check demonstration-2-1/saisons.js
          node outils/verifier-demonstration.cjs . demonstration-2-1
          node outils/verifier-demonstration21.cjs .
