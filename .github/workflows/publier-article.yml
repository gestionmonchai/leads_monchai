# Publication automatique des articles (actualités réglementaires et guides).
# Cadence habituelle lundi/jeudi ; série quotidienne du 19 au 25 octobre 2026.
# Prend le premier article en attente dont la date prévue est atteinte sur la
# branche file-attente, le date, l'insère dans le site (page + carte + sitemap)
# et déploie GitHub Pages.
#
# Déclenchement : le cron de GitHub part avec plusieurs heures de retard
# (constaté : 6 h 30 en septembre 2026). L'heure de 11h est donc tenue par un
# appel workflow_dispatch envoyé depuis le poste de Denis (tâche planifiée
# Windows, script declenche-publication.ps1). Le cron ci-dessous ne sert que
# de filet de sécurité : il ne publie rien si un article est déjà sorti le
# même jour.
#
# La branche file-attente porte la file (articles/, manifest.json) et la
# documentation (README, LIGNE-EDITORIALE, MOTS-CLES).
name: Publier le prochain article

on:
  schedule:
    - cron: '0 9 19-24 10 *'   # 11h à Paris avant le changement d’heure
    - cron: '0 10 25 10 *'     # 11h à Paris le dimanche, après le changement d’heure
    - cron: '0 10 * * 1,4'   # lundi et jeudi 10:00 UTC, filet de sécurité
  workflow_dispatch:
    inputs:
      test:
        description: "Test à blanc : tout faire sauf pousser et déployer"
        type: boolean
        default: false
      forcer:
        description: "Slug à publier même si sa date n'est pas atteinte (laisser vide en usage normal)"
        type: string
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le site (main)
        uses: actions/checkout@v4
        with:
          path: site

      - name: Récupérer la file d'attente
        uses: actions/checkout@v4
        with:
          ref: file-attente
          path: file

      - name: Choisir l'article dû
        id: choix
        env:
          FORCER: ${{ inputs.forcer }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          AUJOURDHUI=$(TZ=Europe/Paris date +%F) node site/outils/choisir-article.cjs file/manifest.json

      - name: Dater et insérer l'article
        if: steps.choix.outputs.publier == 'oui'
        run: |
          set -e
          SLUG="${{ steps.choix.outputs.slug }}"
          FICHIER="${{ steps.choix.outputs.fichier }}"
          DATE_ISO="${{ steps.choix.outputs.date }}"
          DESTINATION="${{ steps.choix.outputs.destination }}"
          PILIER="${{ steps.choix.outputs.pilier }}"
          SERIE="${{ steps.choix.outputs.serie }}"
          MOIS=(janvier février mars avril mai juin juillet août septembre octobre novembre décembre)
          JOUR=$((10#$(TZ=Europe/Paris date +%d)))
          if [ "$JOUR" = "1" ]; then JOUR_FR="1ᵉʳ"; else JOUR_FR="$JOUR"; fi
          DATE_FR="$JOUR_FR ${MOIS[$((10#$(TZ=Europe/Paris date +%m)-1))]} $(TZ=Europe/Paris date +%Y)"
          echo "Date de publication : $DATE_FR ($DATE_ISO)"

          sed -i "s/{{DATE_ISO}}/$DATE_ISO/g; s/{{DATE_FR}}/$DATE_FR/g" \
            "file/articles/$FICHIER.html" "file/articles/$FICHIER.carte.html"
          cp "file/articles/$FICHIER.html" "site/$SLUG.html"

          if [ "$DESTINATION" = "ressources" ]; then
            # Guide de la rubrique Ressources : carte sous le repère de ressources.html,
            # puis activation du lien préparé dans la page pilier.
            REPERE="FILE-ATTENTE : guides"
            if [ "$SERIE" = "leviers-2026-10" ]; then REPERE="FILE-ATTENTE : debouches"; fi
            grep -q "$REPERE" site/ressources.html || { echo "::error::Repère $REPERE absent de ressources.html"; exit 1; }
            sed -i "/$REPERE/r file/articles/$FICHIER.carte.html" site/ressources.html
            if [ -n "$PILIER" ] && [ -f "site/$PILIER.html" ]; then
              sed -i "s|<!--SATELLITE:$SLUG \(.*\) SATELLITE-->|\1|" "site/$PILIER.html"
              sed -i "s/\"dateModified\": *\"[0-9-]*\"/\"dateModified\": \"$DATE_ISO\"/" "site/$PILIER.html"
              if grep -q "SATELLITE:$SLUG " "site/$PILIER.html"; then echo "::error::Lien satellite non activé dans $PILIER.html"; exit 1; fi
              echo "Lien activé dans le pilier $PILIER.html"
            fi
          else
            sed -i "/FILE-ATTENTE : les nouvelles cartes/r file/articles/$FICHIER.carte.html" \
              site/actualites-reglementaires.html
            CATEGORIE="${{ steps.choix.outputs.categorie }}"
            HUB="site/actualites-$CATEGORIE.html"
            if [ -n "$CATEGORIE" ] && [ -f "$HUB" ]; then
              sed -i "/FILE-ATTENTE : cartes de la catégorie/r file/articles/$FICHIER.carte.html" "$HUB"
              echo "Carte insérée dans le hub $HUB"
            else
              echo "::warning::Hub introuvable pour la catégorie $CATEGORIE : carte non insérée dans un hub."
            fi
          fi

          # La série commerciale est également visible dans sa rubrique et son filtre.
          if [ "$SERIE" = "leviers-2026-10" ]; then
            node site/outils/referencer-serie.cjs site "file/articles/$FICHIER.actualites.carte.html" "$SLUG" "$DATE_ISO" "$DATE_FR"
          fi

          printf '  <url>\n    <loc>https://monchai.fr/%s.html</loc>\n    <lastmod>%s</lastmod>\n    <changefreq>monthly</changefreq>\n    <priority>0.7</priority>\n  </url>\n' \
            "$SLUG" "$DATE_ISO" > /tmp/sitemap-bloc.xml
          if grep -q "FILE-ATTENTE : nouvelles URL" site/sitemap.xml; then
            sed -i "/FILE-ATTENTE : nouvelles URL/r /tmp/sitemap-bloc.xml" site/sitemap.xml
          else
            echo "::warning::Repère du sitemap absent : URL insérée avant </urlset>."
            sed -i "/<\/urlset>/e cat /tmp/sitemap-bloc.xml" site/sitemap.xml
          fi

          jq --arg s "$SLUG" --arg d "$DATE_ISO" \
            '(.articles[] | select(.slug==$s) | .statut) = ("publie_" + $d)' \
            file/manifest.json > /tmp/manifest.json
          mv /tmp/manifest.json file/manifest.json

          echo "--- Contrôles (bloquants) ---"
          grep -q "monchai.fr/$SLUG.html" site/sitemap.xml || { echo "::error::URL absente du sitemap"; exit 1; }
          ! grep -q "{{DATE" "site/$SLUG.html" || { echo "::error::Dates non remplacées dans la page"; exit 1; }
          if [ "$DESTINATION" = "ressources" ]; then
            grep -q "href=\"$SLUG.html\"" site/ressources.html || { echo "::error::Carte absente de ressources.html"; exit 1; }
          else
            grep -q "href=\"$SLUG.html\"" site/actualites-reglementaires.html || { echo "::error::Carte absente de l'index des actualités"; exit 1; }
          fi
          echo "Contrôles OK"

      - name: Test à blanc, montrer le diff sans pousser
        if: steps.choix.outputs.publier == 'oui' && inputs.test == true
        run: |
          echo "=== Diff site (main) ==="
          cd site && git add -A && git diff --cached --stat && git diff --cached -- actualites-reglementaires.html ressources.html sitemap.xml | head -80
          echo "=== Diff file-attente ==="
          cd ../file && git add -A && git diff --cached --stat

      - name: Pousser les deux branches
        if: steps.choix.outputs.publier == 'oui' && inputs.test != true
        run: |
          SLUG="${{ steps.choix.outputs.slug }}"
          for d in site file; do
            git -C "$d" config user.name "publication-automatique"
            git -C "$d" config user.email "gestion.mon.chai@gmail.com"
          done
          git -C site add -A
          git -C site commit -m "Publication automatique : $SLUG"
          git -C site push
          git -C file add -A
          git -C file commit -m "File d'attente : $SLUG publié"
          git -C file push

      - name: Configurer Pages
        if: steps.choix.outputs.publier == 'oui' && inputs.test != true
        uses: actions/configure-pages@v5

      # Même optimisation que static.yml, après la poussée : elle ne touche
      # que la copie publiée, jamais ce qui est commité.
      - name: Optimiser le site
        if: steps.choix.outputs.publier == 'oui' && inputs.test != true
        continue-on-error: true
        run: |
          DEPS="$RUNNER_TEMP/construire"
          mkdir -p "$DEPS"
          cp site/outils/construire/package.json site/outils/construire/package-lock.json "$DEPS/"
          npm ci --prefix "$DEPS" --ignore-scripts --no-audit --no-fund --loglevel=error
          NODE_PATH="$DEPS/node_modules" node site/outils/construire/construire.js site

      - name: Retirer l'outillage de la copie publiée
        if: steps.choix.outputs.publier == 'oui' && inputs.test != true
        run: rm -rf site/outils

      - name: Construire l'artefact
        if: steps.choix.outputs.publier == 'oui' && inputs.test != true
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

      - name: Déployer GitHub Pages
        if: steps.choix.outputs.publier == 'oui' && inputs.test != true
        id: deployment
        uses: actions/deploy-pages@v4
